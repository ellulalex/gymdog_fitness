# Gymdog storefront — nginx site.
# Install: copy to /etc/nginx/sites-available/gymdog, symlink into sites-enabled,
# adjust server_name, then `nginx -t && systemctl reload nginx`.
# TLS is added afterwards (certbot --nginx, or a Cloudflare Origin Certificate).

server {
    listen 80;
    listen [::]:80;
    server_name staging.gymdog.fitness;

    root /home/gymdog/app/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/gymdog.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Deny access to hidden files (.env, .git, …).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
